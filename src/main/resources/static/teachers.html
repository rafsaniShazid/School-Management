<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - School Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>School Management System</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="students.html">Students</a></li>
            <li><a href="teachers.html" class="active" id="teachersLink">Teachers</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="enrollments.html">Enrollments</a></li>
            <li><a href="departments.html" id="departmentsLink">Departments</a></li>
            <li style="margin-left: auto;"><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Teacher Management</h2>
        
        <div id="message"></div>

        <div class="form-container">
            <h3 id="formTitle">Add New Teacher</h3>
            <form id="teacherForm">
                <input type="hidden" id="teacherId">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone:</label>
                    <input type="text" id="phone" required>
                </div>
                <div class="form-group">
                    <label>Subject:</label>
                    <input type="text" id="subject" required>
                </div>
                <button type="submit" class="btn">Save Teacher</button>
                <button type="button" class="btn" onclick="resetForm()">Cancel</button>
            </form>
        </div>

        <h3>All Teachers</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Subject</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="teacherList"></tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/teachers';

        async function loadTeachers() {
            const response = await fetch(API_URL);
            const teachers = await response.json();
            const tbody = document.getElementById('teacherList');
            tbody.innerHTML = teachers.map(t => `
                <tr>
                    <td>${t.id}</td>
                    <td>${t.name}</td>
                    <td>${t.email}</td>
                    <td>${t.phone}</td>
                    <td>${t.subject}</td>
                    <td class="actions">
                        <button class="btn" onclick="editTeacher(${t.id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteTeacher(${t.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('teacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('teacherId').value;
            const teacher = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                subject: document.getElementById('subject').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(teacher)
            });

            if (response.ok) {
                showMessage('Teacher saved successfully!', 'success');
                resetForm();
                loadTeachers();
            } else {
                showMessage('Error saving teacher', 'error');
            }
        });

        async function editTeacher(id) {
            const response = await fetch(`${API_URL}/${id}`);
            const teacher = await response.json();
            document.getElementById('teacherId').value = teacher.id;
            document.getElementById('name').value = teacher.name;
            document.getElementById('email').value = teacher.email;
            document.getElementById('phone').value = teacher.phone;
            document.getElementById('subject').value = teacher.subject;
            document.getElementById('formTitle').textContent = 'Edit Teacher';
        }

        async function deleteTeacher(id) {
            if (confirm('Are you sure you want to delete this teacher?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showMessage('Teacher deleted successfully!', 'success');
                    loadTeachers();
                }
            }
        }

        function resetForm() {
            document.getElementById('teacherForm').reset();
            document.getElementById('teacherId').value = '';
            document.getElementById('formTitle').textContent = 'Add New Teacher';
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => msgDiv.innerHTML = '', 3000);
        }

        loadTeachers();
    </script>
</body>
</html>
