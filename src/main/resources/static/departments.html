<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - School Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>School Management System</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="students.html">Students</a></li>
            <li><a href="teachers.html" id="teachersLink">Teachers</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="enrollments.html">Enrollments</a></li>
            <li><a href="departments.html" class="active" id="departmentsLink">Departments</a></li>
            <li style="margin-left: auto;"><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Department Management</h2>
        
        <div id="message"></div>

        <div class="form-container">
            <h3 id="formTitle">Add New Department</h3>
            <form id="departmentForm">
                <input type="hidden" id="departmentId">
                <div class="form-group">
                    <label>Department Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Department Code:</label>
                    <input type="text" id="code" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <button type="submit" class="btn">Save Department</button>
                <button type="button" class="btn" onclick="resetForm()">Cancel</button>
            </form>
        </div>

        <h3>All Departments</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="departmentList"></tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/departments';

        async function loadDepartments() {
            const response = await fetch(API_URL);
            const departments = await response.json();
            const tbody = document.getElementById('departmentList');
            tbody.innerHTML = departments.map(d => `
                <tr>
                    <td>${d.id}</td>
                    <td>${d.code}</td>
                    <td>${d.name}</td>
                    <td>${d.description || '-'}</td>
                    <td class="actions">
                        <button class="btn" onclick="editDepartment(${d.id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteDepartment(${d.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('departmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('departmentId').value;
            const department = {
                name: document.getElementById('name').value,
                code: document.getElementById('code').value,
                description: document.getElementById('description').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(department)
            });

            if (response.ok) {
                showMessage('Department saved successfully!', 'success');
                resetForm();
                loadDepartments();
            } else {
                showMessage('Error saving department', 'error');
            }
        });

        async function editDepartment(id) {
            const response = await fetch(`${API_URL}/${id}`);
            const department = await response.json();
            document.getElementById('departmentId').value = department.id;
            document.getElementById('name').value = department.name;
            document.getElementById('code').value = department.code;
            document.getElementById('description').value = department.description || '';
            document.getElementById('formTitle').textContent = 'Edit Department';
        }

        async function deleteDepartment(id) {
            if (confirm('Are you sure you want to delete this department?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showMessage('Department deleted successfully!', 'success');
                    loadDepartments();
                }
            }
        }

        function resetForm() {
            document.getElementById('departmentForm').reset();
            document.getElementById('departmentId').value = '';
            document.getElementById('formTitle').textContent = 'Add New Department';
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => msgDiv.innerHTML = '', 3000);
        }

        loadDepartments();
    </script>
</body>
</html>
