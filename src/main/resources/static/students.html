<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - School Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>School Management System</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="students.html" class="active">Students</a></li>
            <li><a href="teachers.html" id="teachersLink">Teachers</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="enrollments.html">Enrollments</a></li>
            <li><a href="departments.html" id="departmentsLink">Departments</a></li>
            <li style="margin-left: auto;"><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Student Management</h2>
        
        <div id="message"></div>

        <div class="form-container">
            <h3 id="formTitle">Add New Student</h3>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone:</label>
                    <input type="text" id="phone" required>
                </div>
                <button type="submit" class="btn">Save Student</button>
                <button type="button" class="btn" onclick="resetForm()">Cancel</button>
            </form>
        </div>

        <h3>All Students</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentList"></tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/students';

        async function loadStudents() {
            const response = await fetch(API_URL);
            const students = await response.json();
            const tbody = document.getElementById('studentList');
            tbody.innerHTML = students.map(s => `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.name}</td>
                    <td>${s.email}</td>
                    <td>${s.phone}</td>
                    <td class="actions">
                        <button class="btn" onclick="editStudent(${s.id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteStudent(${s.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('studentId').value;
            const student = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });

            if (response.ok) {
                showMessage('Student saved successfully!', 'success');
                resetForm();
                loadStudents();
            } else {
                showMessage('Error saving student', 'error');
            }
        });

        async function editStudent(id) {
            const response = await fetch(`${API_URL}/${id}`);
            const student = await response.json();
            document.getElementById('studentId').value = student.id;
            document.getElementById('name').value = student.name;
            document.getElementById('email').value = student.email;
            document.getElementById('phone').value = student.phone;
            document.getElementById('formTitle').textContent = 'Edit Student';
        }

        async function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showMessage('Student deleted successfully!', 'success');
                    loadStudents();
                }
            }
        }

        function resetForm() {
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('formTitle').textContent = 'Add New Student';
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => msgDiv.innerHTML = '', 3000);
        }

        loadStudents();
    </script>
</body>
</html>
