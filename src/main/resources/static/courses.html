<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - School Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>School Management System</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="students.html">Students</a></li>
            <li><a href="teachers.html" id="teachersLink">Teachers</a></li>
            <li><a href="courses.html" class="active">Courses</a></li>
            <li><a href="enrollments.html">Enrollments</a></li>
            <li><a href="departments.html" id="departmentsLink">Departments</a></li>
            <li style="margin-left: auto;"><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Course Management</h2>
        
        <div id="message"></div>

        <div class="form-container">
            <h3 id="formTitle">Add New Course</h3>
            <form id="courseForm">
                <input type="hidden" id="courseId">
                <div class="form-group">
                    <label>Course Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Course Code:</label>
                    <input type="text" id="code" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Credits:</label>
                    <input type="number" id="credits" required>
                </div>
                <button type="submit" class="btn">Save Course</button>
                <button type="button" class="btn" onclick="resetForm()">Cancel</button>
            </form>
        </div>

        <h3>All Courses</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Credits</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="courseList"></tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/courses';

        async function loadCourses() {
            const response = await fetch(API_URL);
            const courses = await response.json();
            const tbody = document.getElementById('courseList');
            tbody.innerHTML = courses.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.code}</td>
                    <td>${c.name}</td>
                    <td>${c.description || '-'}</td>
                    <td>${c.credits}</td>
                    <td class="actions">
                        <button class="btn" onclick="editCourse(${c.id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteCourse(${c.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('courseId').value;
            const course = {
                name: document.getElementById('name').value,
                code: document.getElementById('code').value,
                description: document.getElementById('description').value,
                credits: parseInt(document.getElementById('credits').value)
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(course)
            });

            if (response.ok) {
                showMessage('Course saved successfully!', 'success');
                resetForm();
                loadCourses();
            } else {
                showMessage('Error saving course', 'error');
            }
        });

        async function editCourse(id) {
            const response = await fetch(`${API_URL}/${id}`);
            const course = await response.json();
            document.getElementById('courseId').value = course.id;
            document.getElementById('name').value = course.name;
            document.getElementById('code').value = course.code;
            document.getElementById('description').value = course.description || '';
            document.getElementById('credits').value = course.credits;
            document.getElementById('formTitle').textContent = 'Edit Course';
        }

        async function deleteCourse(id) {
            if (confirm('Are you sure you want to delete this course?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showMessage('Course deleted successfully!', 'success');
                    loadCourses();
                }
            }
        }

        function resetForm() {
            document.getElementById('courseForm').reset();
            document.getElementById('courseId').value = '';
            document.getElementById('formTitle').textContent = 'Add New Course';
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => msgDiv.innerHTML = '', 3000);
        }

        loadCourses();
    </script>
</body>
</html>
